spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bankmanagementsystem}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET:change-this-secret-in-production-change-this-secret-32chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
